name: Hadith app checks

on: [push, pull_request]

jobs:
  hadith:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app
        run: python -m pip install ".[hadith]"
      - name: Check catalog and comparison without model download
        run: python -m unittest discover -s tests -p test_hadith.py -v
